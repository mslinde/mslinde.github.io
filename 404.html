<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Your Name</title>
  <!-- GitHub Pages serves this file at whatever bad URL was requested, so these
       paths are absolute. If your repo is NOT named <username>.github.io,
       prefix each "/" below with your repo name, e.g. "/portfolio/styles.css". -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <main class="container not-found">
    <div>
      <p class="eyebrow">404</p>
      <h1>Page not found</h1>
      <p class="lead">That link doesn't go anywhere.</p>
      <a class="btn btn-primary" href="/">Go to the homepage</a>
    </div>
  </main>
</body>
</html>
